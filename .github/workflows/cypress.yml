name: Cypress Smoke and Infra

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  cypress-run:
    runs-on: ubuntu-latest
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://www.storis.com' }}
      EXPECTED_REGION: ${{ vars.EXPECTED_REGION || 'allowed' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress suites
        run: npm run cy:run

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos/**
          if-no-files-found: ignore

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots/**
          if-no-files-found: ignore

      - name: Create issue when suite fails
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const title = `CI Failure: Cypress suites failed on ${context.sha.substring(0, 7)}`;
            const body = [
              "Cypress test suites failed after a push to `main`.",
              "",
              `- Commit: \`${context.sha}\``,
              `- Workflow run: ${runUrl}`,
              `- Triggered by: @${context.actor}`,
              "",
              "Please review the uploaded artifacts (videos/screenshots) in the workflow run."
            ].join("\n");

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ["ci", "cypress", "automated"]
            });
